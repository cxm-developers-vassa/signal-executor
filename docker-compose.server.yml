services:
  mysql:
    image: mysql:8.4
    container_name: signal-prod-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ${DB_DATA_PATH}:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  signal-executor:
    image: signal-executor:latest
    container_name: signal-prod-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DATABASE_URL: "mysql://${DB_USER}:${DB_PASSWORD}@mysql:3306/${DB_NAME}"
      SHADOW_DATABASE_URL: "mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/prisma_shadow"
      BINGX_API_KEY: ${BINGX_API_KEY}
      BINGX_API_SECRET: ${BINGX_API_SECRET}
      BINGX_BASE_URL: ${BINGX_BASE_URL}